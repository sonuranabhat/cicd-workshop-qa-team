name: Frontend PR & E2E Pipeline

on:
  pull_request:
    branches: 
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test

      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

  deploy-frontend:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy frontend to S3
        run: |
        chmod +x ./scripts/deploy-frontend.sh
        ./scripts/deploy-frontend.sh

      # Assume this script deploys frontend and sets output
      
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}

  cypress-e2e:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress E2E Tests
        run: |
          npx cypress run
        env:
          CYPRESS_BASE_URL: ${{ secrets.FRONTEND_URL }}
          CYPRESS_API_URL: ${{ secrets.REACT_APP_API_URL }}
          ENV: ${{ secrets.FRONTEND_ENV }}

  notify-slack:
    needs: cypress-e2e
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack message
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": ":white_check_mark: E2E pipeline completed successfully for PR #${{ github.event.pull_request.number }} on *main* branch."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
